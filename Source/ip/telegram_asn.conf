# $ custom_build_script
# The ASNs known to be Telegram's. The build finds more (see Build/build-telegram.ts): every ASN that announces a prefix
# Telegram publishes is added, as long as the AS is registered under the name of Telegram. One that is not registered
# to Telegram any more is left out. This list is where that lookup starts, and what is used when it fails.

# Telegram DC2/DC4 - Amsterdam
IP-ASN,62041
# Telegram DC5 - Singapore
IP-ASN,62014
# Telegram DC1/DC3 - Miami
IP-ASN,59930
# Telegram India CDN
IP-ASN,44907
# Telegram Finland, RETN Transit Only
IP-ASN,211157
