# $ meta_title Sukka's Ruleset - Telegram Domains and MTProto
# $ meta_description This file contains domains used by Telegram Messenger, and PROTOCOL,MTProto, which matches everything that comes in through Surge's MTProto proxy server.
# $ meta_description Those connections target a Telegram IP address, not a hostname, so the domains never match them. See https://manual.nssurge.com/features/mtproto.html

PROTOCOL,MTProto

DOMAIN-SUFFIX,t.me
DOMAIN-SUFFIX,tx.me
DOMAIN-SUFFIX,tg.dev
DOMAIN-SUFFIX,tdesktop.com
DOMAIN-SUFFIX,telegra.ph
DOMAIN-SUFFIX,telega.one
DOMAIN-SUFFIX,telegram.me
DOMAIN-SUFFIX,telegram.org
DOMAIN-SUFFIX,telegram.dog
DOMAIN-SUFFIX,telegram.space
DOMAIN-SUFFIX,graph.org
DOMAIN-SUFFIX,legra.ph
DOMAIN-SUFFIX,telesco.pe
DOMAIN-SUFFIX,cdn-telegram.org
