# $ meta_title Surge Ruleset - YouTube Music
# $ meta_description This file contains rules for YouTube Music.
# $ meta_description It is written by hand, unlike the ruleset of YouTube: the community has no list for YouTube Music to generate it from.
# $ meta_description YouTube Music shares its domains with YouTube (see the youtube ruleset), so this file only has what sets it apart.

DOMAIN,music.youtube.com

# The same as in stream.ts
USER-AGENT,com.google.ios.youtubemusic*
USER-AGENT,YouTubeMusic*
