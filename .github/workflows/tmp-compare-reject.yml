name: Temporary compare of the reject sources
on:
  push:
    branches:
      - claude/project-thread-ib33qm

permissions:
  contents: read

jobs:
  # Does a GitHub runner get the original hosts' files, or does Cloudflare challenge it?
  # Four runners (four different egress IPs), the build's own HTTP client and User-Agent.
  probe:
    name: Probe the original hosts (runner ${{ matrix.shard }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          install: false
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - run: pnpm config set --location=global minimumReleaseAge 0
      - run: pnpm install
      - name: Request each original file six times, five seconds apart
        run: |
          cat > tmp-probe.cjs <<'EOF'
          const { fetch, Agent } = require('undici');

          const agent = new Agent({ allowH2: false });
          const urls = [
            'https://someonewhocares.org/hosts/zero/hosts',
            'https://someonewhocares.org/hosts/hosts',
            'https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext',
            'https://filters.adtidy.org/extension/ublock/filters/2_optimized.txt'
          ];
          const tally = new Map(urls.map(url => [url, { ok: 0, bad: 0 }]));

          (async () => {
            for (let round = 1; round <= 6; round++) {
              for (const url of urls) {
                const started = Date.now();
                let line;
                try {
                  const res = await fetch(url, {
                    dispatcher: agent,
                    headers: { 'User-Agent': 'node-fetch' },
                    signal: AbortSignal.timeout(60000)
                  });
                  const body = await res.text();
                  const ok = res.status === 200 && body.length > 1000;
                  tally.get(url)[ok ? 'ok' : 'bad']++;
                  line = `${res.status} ${body.length}B ${Date.now() - started}ms cf-mitigated=${res.headers.get('cf-mitigated')} server=${res.headers.get('server')}`;
                  if (!ok) line += ` body=${JSON.stringify(body.slice(0, 150))}`;
                } catch (error) {
                  tally.get(url).bad++;
                  line = `ERROR ${error.message} ${error.cause && error.cause.code}`;
                }
                console.log(`round ${round}: ${line} ${url}`);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            console.log('---- summary');
            for (const [url, { ok, bad }] of tally) console.log(`ok=${ok} bad=${bad} ${url}`);
          })();
          EOF
          node tmp-probe.cjs

  # The reject lists built twice at the same time: with the config before this change
  # (Dan Pollock's hosts file through proxy.cdn.skk.moe) and with the original hosts.
  compare:
    name: Reject lists, relay against original hosts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          install: false
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - run: pnpm config set --location=global minimumReleaseAge 0
      - run: pnpm install
      - name: Build the reject lists with both configs
        run: |
          set -eo pipefail
          cat > tmp-run-reject.ts <<'EOF'
          import process from 'node:process';
          import { buildRejectDomainSet } from './Build/build-reject-domainset';
          import { printExternalDownloadStats } from './Build/lib/download-stats';
          import { endBuildWorkerFarm, getBuildWorkerFarm } from './Build/lib/build-worker-farm';

          (async () => {
            getBuildWorkerFarm();
            try {
              await buildRejectDomainSet();
              printExternalDownloadStats();
              await endBuildWorkerFarm();
              process.exit(0);
            } catch (e) {
              console.error('Something went wrong!');
              console.trace(e);
              process.exit(1);
            }
          })();
          EOF

          cp Build/constants/reject-data-source.ts /tmp/ds.new.ts
          git show 4dbcab0:Build/constants/reject-data-source.ts > /tmp/ds.old.ts

          for variant in old new; do
            cp /tmp/ds.$variant.ts Build/constants/reject-data-source.ts
            mkdir -p /tmp/out-$variant/List/domainset /tmp/out-$variant/List/non_ip /tmp/out-$variant/List/ip /tmp/out-$variant/Internal
            PUBLIC_DIR=/tmp/out-$variant pnpm run node tmp-run-reject.ts > /tmp/build-$variant.log 2>&1 || { tail -100 /tmp/build-$variant.log; exit 1; }
            echo "==== $variant config: downloads of the sources that changed, and every failure or retry"
            sed -E 's/\x1b\[[0-9;]*m//g' /tmp/build-$variant.log | grep -E "\[external download\].*(someonewhocares|pgl\.yoyo|adtidy|skk\.moe)|\[fetch (fail|retry|fallback)" || true
          done
          cp /tmp/ds.new.ts Build/constants/reject-data-source.ts

          echo "==== lists built with the relay (old config) against the original hosts (new config), comments left out"
          cd /tmp
          for f in $(cd out-old && find . -type f | sort); do
            if [ ! -f "out-new/$f" ]; then echo "$f: only in the old build"; continue; fi
            { grep -vE '^(#|!)' "out-old/$f" || true; } | sort -u > a.txt
            { grep -vE '^(#|!)' "out-new/$f" || true; } | sort -u > b.txt
            only_old=$(comm -23 a.txt b.txt | wc -l)
            only_new=$(comm -13 a.txt b.txt | wc -l)
            echo "$f: old $(wc -l < a.txt) lines, new $(wc -l < b.txt) lines, only in old $only_old, only in new $only_new"
            if [ "$only_old" != 0 ]; then echo "  only in old:"; comm -23 a.txt b.txt | head -40 | sed 's/^/    /'; fi
            if [ "$only_new" != 0 ]; then echo "  only in new:"; comm -13 a.txt b.txt | head -40 | sed 's/^/    /'; fi
          done
          for f in $(cd out-new && find . -type f | sort); do
            [ -f "out-old/$f" ] || echo "$f: only in the new build"
          done
