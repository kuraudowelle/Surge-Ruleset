name: Temporary compare of chnroutes2 sources
on:
  push:
    branches:
      - claude/project-thread-ib33qm

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Compare
        run: |
          set -u
          UA='Mozilla/5.0 (compatible; SurgeRulesetBuilder; +https://github.com/kuraudowelle/Surge)'
          mkdir -p /tmp/c && cd /tmp/c
          curl -sS -m 60 -A "$UA" -D sukka.headers https://chnroutes2.cdn.skk.moe/chnroutes.txt -o sukka.txt
          curl -sS -m 60 -A "$UA" -D misaka.headers https://raw.githubusercontent.com/misakaio/chnroutes2/master/chnroutes.txt -o misaka.txt
          curl -sS -m 60 -A "$UA" -D jsd.headers https://cdn.jsdelivr.net/gh/misakaio/chnroutes2@master/chnroutes.txt -o jsd.txt
          echo "== sukka headers"; grep -iE '^(HTTP|server|last-modified|etag|content-length|cf-|x-)' sukka.headers | head -20
          echo "== sukka comment lines"; grep '^#' sukka.txt | head -20
          echo "== misaka comment lines"; grep '^#' misaka.txt | head -20
          echo "== jsdelivr equals raw: $(cmp -s misaka.txt jsd.txt && echo yes || echo NO)"
          echo "sukka lines: $(wc -l < sukka.txt)  misaka lines: $(wc -l < misaka.txt)"
          python3 - <<'EOF'
          import ipaddress

          def load(path):
              nets = []
              for line in open(path):
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  try:
                      nets.append(ipaddress.ip_network(line, strict=False))
                  except ValueError:
                      print('skipped line:', line)
              return nets

          def total(nets):
              return sum(n.num_addresses for n in nets)

          def minus(a, b):
              b_sorted = sorted(b, key=lambda n: int(n.network_address))
              result = []
              for n in a:
                  parts = [n]
                  for x in b_sorted:
                      if int(x.network_address) > int(n.broadcast_address):
                          break
                      if int(x.broadcast_address) < int(n.network_address):
                          continue
                      new = []
                      for p in parts:
                          if not p.overlaps(x):
                              new.append(p)
                          elif p.subnet_of(x):
                              continue
                          else:
                              new.extend(p.address_exclude(x))
                      parts = new
                  result.extend(parts)
              return list(ipaddress.collapse_addresses(result))

          s = load('/tmp/c/sukka.txt')
          m = load('/tmp/c/misaka.txt')
          sc = list(ipaddress.collapse_addresses(s))
          mc = list(ipaddress.collapse_addresses(m))
          print('sukka: %d entries, %d after merging, %d addresses' % (len(s), len(sc), total(sc)))
          print('misaka: %d entries, %d after merging, %d addresses' % (len(m), len(mc), total(mc)))
          only_s = minus(sc, mc)
          only_m = minus(mc, sc)
          print('only in sukka: %d networks, %d addresses' % (len(only_s), total(only_s)))
          print('only in misaka: %d networks, %d addresses' % (len(only_m), total(only_m)))
          for n in only_s[:150]:
              print('SUKKA-ONLY', n)
          for n in only_m[:150]:
              print('MISAKA-ONLY', n)
          EOF
